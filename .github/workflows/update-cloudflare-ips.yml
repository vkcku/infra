name: Update Cloudflare IPs

on:
  # Run every day at 06:00 UTC.
  schedule:
    - cron: "0 6 * * *"
  # Allow manually triggering an update from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-cloudflare-ips
  cancel-in-progress: false

jobs:
  update:
    name: Update Cloudflare IPs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nushell
        uses: hustcer/setup-nu@4afddc3dca2f17da589e65a34ebee184729a4e13 # v3.26
        with:
          # The commands used are simple enough that updates shouldn't break
          # the script.
          version: "*"

      - name: Refresh Cloudflare IP ranges
        run: nu scripts/update-cloudflare-ip-list.nu

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update-cloudflare-ips
          title: "caddy: update Cloudflare IP ranges"
          commit-message: "caddy: update Cloudflare IP ranges"
          body: |
            Automated update of the Cloudflare IP ranges used as trusted
            proxies in `modules/caddy`.

            Generated by the `Update Cloudflare IPs` workflow.
          delete-branch: true
          sign-commits: true
